<!DOCTYPE html>
<html>
<head>
    <title>Guess the Number</title>
</head>
<body>

    <h1>🎮 Guess the Number</h1>

    <p>Guess a number between 1 and 10</p>

    <form method="POST">
        <input type="number" name="guess" min="1" max="10" required>
        <button type="submit">Guess</button>
    </form>

    <h2>{{ message }}</h2>

</body>
</html>
